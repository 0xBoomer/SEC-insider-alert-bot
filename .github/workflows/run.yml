name: SEC Insider Alert Bot

on:
  schedule:
    # 9:00 AM ET = 14:00 UTC (EST, Nov–Mar) / 13:00 UTC (EDT, Mar–Nov)
    # Using 14:00 UTC covers EST; tweak to 13:00 UTC for summer if desired.
    - cron: "0 14 * * 1-5"   # Monday–Friday at 14:00 UTC

  # Allow manual trigger from the GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit processed.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          # Fetch full history so we can push processed.json changes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated processed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json
          # Only commit if the file actually changed
          git diff --staged --quiet || git commit -m "chore: update processed filings [skip ci]"
          git push
